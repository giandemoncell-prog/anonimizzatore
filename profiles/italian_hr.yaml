name: "Documenti HR italiani"
language: "it"
description: "Contratti di lavoro, buste paga, valutazioni delle prestazioni, referenze"
document_type: "documenti HR e del lavoro italiani"
output_format: "preserve"

entity_types:
  - id: "employee"
    placeholder: "[Dipendente]"
    description: "Nome del dipendente"
  - id: "employer"
    placeholder: "[Datore di lavoro]"
    description: "Nome della persona fisica datore di lavoro"
  - id: "manager"
    placeholder: "[Responsabile]"
    description: "Responsabile diretto o superiore gerarchico"
  - id: "hr_manager"
    placeholder: "[Responsabile HR]"
    description: "Responsabile delle risorse umane"
  - id: "company"
    placeholder: "[Azienda]"
    description: "Ragione sociale dell'azienda"
  - id: "city"
    placeholder: "[Comune]"
    description: "Comune o citt\xE0 identificativa"
  - id: "birth_place"
    placeholder: "[Luogo di nascita]"
    description: "Luogo di nascita del dipendente"

regex_rules:
  - name: "Codici fiscali"
    pattern: '\b[A-Z]{6}\d{2}[A-Z]\d{2}[A-Z]\d{3}[A-Z]\b'
    placeholder: "[CF]"
  - name: "Partite IVA"
    pattern: '\b\d{11}\b'
    placeholder: "[P.IVA]"
  - name: "IBAN"
    pattern: '\bIT\d{2}[A-Z]\d{22}\b'
    placeholder: "[IBAN]"
  - name: "Telefoni"
    pattern: '\b(?:\+39[\s\-]?)?(?:0\d{1,4}[\s\-]?\d{4,8}|3\d{2}[\s\-]?\d{6,7})\b'
    placeholder: "[Telefono]"
  - name: "Email"
    pattern: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    placeholder: "[Email]"
  - name: "Indirizzi stradali"
    pattern: '\b(?:Via|Viale|Corso|Piazza|Piazzale|Largo|Vicolo|Strada|Contrada|Loc(?:alit\xE0)?\.?)\s+[A-Za-z\xC0-\xFF][A-Za-z\xC0-\xFF .\-\x27]{1,40}?,?[ \t]+(?:n(?:\.|\xB0)?[ \t]*)?\d{1,4}[a-zA-Z]?\b'
    placeholder: "[Indirizzo]"
  - name: "CAP"
    pattern: '(?<=,\s)\d{5}\b|(?<=\s)\d{5}(?=\s+[A-Z\xC0-\xDD][A-Za-z\xC0-\xFF])'
    placeholder: "[CAP]"
    ignore_case: false
  - name: "Date numeriche"
    pattern: '\b\d{1,2}[/\-\.]\d{1,2}[/\-\.]\d{4}\b'
    placeholder: "[Data]"
  - name: "Date scritte"
    pattern: '\b\d{1,2}\s+(?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+\d{4}\b'
    placeholder: "[Data]"

  # Numero di un documento d'identita' dopo la sua etichetta (anche minuscolo: "ca12345ab").
  # Il gruppo "value" sostituisce solo il numero, l'etichetta resta.
  - name: "Documento d'identita'"
    pattern: '(?:carta\s+d(?:i\s+|\x27\s*)identit[\xE0a]\x27?|C\.\s?I\.|C\.I\.E\.|documento(?:\s+di\s+riconoscimento)?|passaporto|patente(?:\s+di\s+guida)?)(?:\s*(?:n\.?|n\xB0|nr\.?|numero))?\s*:?\s*(?P<value>(?=[A-Z0-9]*\d)[A-Z0-9]{7,10})\b'
    placeholder: "[N. Documento]"

  # Carta d'identita' elettronica senza etichetta (CA12345AB): solo maiuscole
  - name: "CIE"
    pattern: '\b[A-Z]{2}\d{5}[A-Z]{2}\b'
    placeholder: "[N. Documento]"
    ignore_case: false

  # Identificativi di pratiche e verbali (INPS, ASL, enti) dopo la loro etichetta
  - name: "Numero pratica/verbale"
    pattern: '(?:n\.?\s*domanda|numero\s+domanda|codice\s+verbale|cod\.?\s*verbale|n\.?\s*verbale|n\.?\s*pratica|numero\s+pratica|codice\s+pratica|n\.?\s*protocollo|prot\.\s*(?:n\.?)?)\s*:?\s*(?P<value>(?=[A-Za-z0-9/\-]*\d)[A-Za-z0-9/\-]{5,})'
    placeholder: "[N. Pratica]"

  # Codici alfanumerici maiuscoli con almeno 8 cifre (protocolli, codici a barre di
  # pratiche, es. A1234567C123456789). Il codice fiscale ne ha 7: non viene toccato.
  - name: "Codice alfanumerico"
    pattern: '\b(?=[A-Z0-9]*[A-Z])(?=(?:[A-Z]*\d){8})[A-Z0-9]{10,25}\b'
    placeholder: "[N. Pratica]"
    ignore_case: false

  # Codici numerici lunghi (>= 10 cifre) rimasti: in un documento italiano sono
  # quasi sempre identificativi (pratiche, tessere sanitarie, protocolli)
  - name: "Codice numerico lungo"
    pattern: '\b\d{10,}\b'
    placeholder: "[N. Pratica]"

ai_prompt_template: "Sei un assistente specializzato nell'anonimizzazione di {document_type}.\n\nSostituisci i dati personali identificativi usando ESATTAMENTE questi segnaposto:\n{entity_list}\n\nREGOLE:\n1. Usa SEMPRE lo stesso segnaposto per la stessa persona o entit\xE0\n2. INIZIA SUBITO con il testo anonimizzato, senza prefissi\n3. Non modificare importi, percentuali, qualifiche, date gi\xE0 anonimizzate\n4. Sostituisci i nomi anche nelle firme e nelle intestazioni\n\nTESTO DA ANONIMIZZARE:\n"
