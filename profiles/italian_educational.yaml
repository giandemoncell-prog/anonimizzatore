name: "Documenti scolastici italiani (PDP/PEI)"
language: "it"
description: "PDP, PEI, profili di funzionamento, diagnosi funzionali, relazioni cliniche"
document_type: "documenti scolastici italiani (PDP, PEI, diagnosi funzionali)"
output_format: "preserve"

entity_types:
  - id: "student"
    placeholder: "[Nome dell'alunno]"
    description: "Nome e cognome dello studente"
  - id: "parent"
    placeholder: "[Genitore {n}]"
    description: "Genitori o tutori legali (numerati automaticamente)"
  - id: "relative"
    placeholder: "[Familiare]"
    description: "Altri familiari (nonni, zii, fratelli)"
  - id: "teacher"
    placeholder: "[Docente]"
    description: "Insegnanti curricolari"
  - id: "support_teacher"
    placeholder: "[Docente di sostegno]"
    description: "Insegnante di sostegno"
  - id: "specialist"
    placeholder: "[Specialista]"
    description: "Psicologi, neuropsichiatri, logopedisti"
  - id: "therapist"
    placeholder: "[Terapista]"
    description: "Terapisti (fisio, occupazionale, ecc.)"
  - id: "professional"
    placeholder: "[Professionista]"
    description: "Tutor privati, consulenti, professionisti esterni"
  - id: "principal"
    placeholder: "[Dirigente]"
    description: "Dirigente scolastico"
  - id: "school"
    placeholder: "[Scuola]"
    description: "Nome specifico della scuola"
  - id: "city"
    placeholder: "[Comune]"
    description: "Comune o città identificativa"
  - id: "birth_place"
    placeholder: "[Luogo di nascita]"
    description: "Luogo di nascita dell'alunno"
  - id: "health_facility"
    placeholder: "[Struttura sanitaria]"
    description: "Ospedali, ASL, centri clinici, strutture sanitarie"

regex_rules:
  - name: "Codici fiscali"
    pattern: '\b[A-Z]{6}\d{2}[A-Z]\d{2}[A-Z]\d{3}[A-Z]\b'
    placeholder: "[CF]"
  - name: "Telefoni"
    pattern: '\b(?:\+39[\s\-]?)?(?:0\d{1,4}[\s\-]?\d{4,8}|3\d{2}[\s\-]?\d{6,7})\b'
    placeholder: "[Telefono]"
  - name: "Email"
    pattern: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    placeholder: "[Email]"
  - name: "Indirizzi stradali"
    pattern: '\b(?:Via|Viale|Corso|Piazza|Piazzale|Largo|Vicolo|Strada|Contrada|Loc(?:alit\xE0)?\.?)\s+[A-Za-z\xC0-\xFF][A-Za-z\xC0-\xFF .\-\x27\u2019]{1,40}?,?[ \t]+(?:n(?:\.|\xB0)?[ \t]*)?\d{1,4}[a-zA-Z]?\b'
    placeholder: "[Indirizzo]"
  # Nome della scuola tra virgolette dopo il tipo di istituto
  # (ISTITUTO DI ISTRUZIONE SUPERIORE «G. BROTZU», I.C. "Don Milani", Liceo “Pacinotti”)
  - name: "Nome scuola"
    pattern: '(?-i:Istituto|ISTITUTO|Liceo|LICEO|Scuola|SCUOLA|Convitto|CONVITTO|I\.\s?C\.|I\.\s?I\.\s?S\.|I\.\s?T\.\s?[CI]\.(?:\s?S\.)?|I\.\s?P\.\s?S\.|C\.\s?P\.\s?I\.\s?A\.)[^«"“\n]{0,60}?[«"“](?P<value>(?-i:[A-Z\xC0-\xDD])[^»"”\n]{1,49})[»"”]'
    placeholder: "[Scuola]"

  # Iniziali dopo l'etichetta della persona ("Alunno/a (iniziali): | P. M.")
  - name: "Iniziali"
    pattern: '(?:alunn[oa](?:/a)?|studente(?:ssa)?|student[ei]|bambin[oa]|paziente|assistit[oa]|dipendente|nome(?:\s+e\s+cognome)?|cognome(?:\s+e\s+nome)?|iniziali)(?:\s*\([^)\n]{0,20}\))?\s*[:|][ \t]*(?:\|[ \t]*)?(?P<value>(?-i:[A-Z])\.[ \t]?(?-i:[A-Z])\.(?:[ \t]?(?-i:[A-Z])\.)?)'
    placeholder: "[Nome dell'alunno]"

  # Indirizzo senza numero civico, riconoscibile perche' seguito dal CAP o dal comune
  # tra parentesi ("Via Pitz’e Serra, 09045 ..." / "Via Roma (Cagliari)")
  - name: "Indirizzi senza civico"
    pattern: '\b(?:Via|Viale|Corso|Piazza|Piazzale|Largo|Vicolo|Strada|Contrada)\s+(?-i:[A-Z\xC0-\xDD])[A-Za-z\xC0-\xFF .\-\x27\u2019]{1,40}?(?=,[ \t]*\d{5}\b|[ \t]*\([ \t]*(?-i:[A-Z]))'
    placeholder: "[Indirizzo]"

  # Comune scritto dopo il CAP ("09045 Quartu Sant’Elena"): il CAP lo sostituisce la regola successiva
  - name: "Comune dopo il CAP"
    pattern: '(?<![\d.,])\b\d{5}[ \t]+(?P<value>(?-i:[A-Z\xC0-\xDD])[A-Za-z\xC0-\xFF\x27\u2019\-]+(?:[ \t]+(?-i:[A-Z\xC0-\xDD])[A-Za-z\xC0-\xFF\x27\u2019\-]+){0,3})'
    placeholder: "[Comune]"
    ignore_case: false

  - name: "CAP"
    pattern: '(?<=,\s)\d{5}\b|(?<=\s)\d{5}(?=\s+(?:[A-Z\xC0-\xDD][A-Za-z\xC0-\xFF]|\[))'
    placeholder: "[CAP]"
    ignore_case: false
  - name: "Numeri protocollo"
    pattern: '\b\d{4}/[A-Z]{2,6}/\d{3,6}\b'
    placeholder: "[N. Protocollo]"
  - name: "Date numeriche"
    pattern: '\b\d{1,2}[/\-\.]\d{1,2}[/\-\.]\d{4}\b'
    placeholder: "[Mese/Anno]"
  - name: "Date scritte"
    pattern: '\b\d{1,2}\s+(?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+\d{4}\b'
    placeholder: "[Mese/Anno]"
  - name: "Mese/anno"
    pattern: '\b(?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+\d{4}\b'
    placeholder: "[Mese/Anno]"

  # Numero di un documento d'identita' dopo la sua etichetta (anche minuscolo: "ca12345ab").
  # Il gruppo "value" sostituisce solo il numero, l'etichetta resta.
  - name: "Documento d'identita'"
    pattern: '(?:carta\s+d(?:i\s+|\x27\s*)identit[\xE0a]\x27?|C\.\s?I\.|C\.I\.E\.|documento(?:\s+di\s+riconoscimento)?|passaporto|patente(?:\s+di\s+guida)?)(?:\s*(?:n\.?|n\xB0|nr\.?|numero))?\s*:?\s*(?P<value>(?=[A-Z0-9]*\d)[A-Z0-9]{7,10})\b'
    placeholder: "[N. Documento]"

  # Carta d'identita' elettronica senza etichetta (CA12345AB): solo maiuscole
  - name: "CIE"
    pattern: '\b[A-Z]{2}\d{5}[A-Z]{2}\b'
    placeholder: "[N. Documento]"
    ignore_case: false

  # Identificativi di pratiche e verbali (INPS, ASL, enti) dopo la loro etichetta
  - name: "Numero pratica/verbale"
    pattern: '(?:n\.?\s*domanda|numero\s+domanda|codice\s+verbale|cod\.?\s*verbale|n\.?\s*verbale|n\.?\s*pratica|numero\s+pratica|codice\s+pratica|n\.?\s*protocollo|prot\.\s*(?:n\.?)?)\s*:?\s*(?P<value>(?=[A-Za-z0-9/\-]*\d)[A-Za-z0-9/\-]{5,})'
    placeholder: "[N. Pratica]"

  # Codici alfanumerici maiuscoli con almeno 8 cifre (protocolli, codici a barre di
  # pratiche, es. A1234567C123456789). Il codice fiscale ne ha 7: non viene toccato.
  - name: "Codice alfanumerico"
    pattern: '\b(?=[A-Z0-9]*[A-Z])(?=(?:[A-Z]*\d){8})[A-Z0-9]{10,25}\b'
    placeholder: "[N. Pratica]"
    ignore_case: false

  # Codici numerici lunghi (>= 10 cifre) rimasti: in un documento italiano sono
  # quasi sempre identificativi (pratiche, tessere sanitarie, protocolli)
  - name: "Codice numerico lungo"
    pattern: '\b\d{10,}\b'
    placeholder: "[N. Pratica]"

ai_prompt_template: "Sei un assistente specializzato nell'anonimizzazione di {document_type}.\n\nIl tuo unico compito \xE8 sostituire i dati personali identificativi usando i segnaposto indicati. NON modificare nient'altro: mantieni struttura, punteggiatura, diagnosi, punteggi, contenuti pedagogici.\n\nSEGNAPOSTO DA USARE:\n{entity_list}\n\nREGOLE FONDAMENTALI:\n1. Usa SEMPRE lo stesso segnaposto per la stessa persona in tutto il documento\n2. INIZIA SUBITO con il testo anonimizzato — ZERO prefissi come \"Ecco il testo:\" o \"Certamente:\"\n3. Non aggiungere testo, non correggere errori grammaticali, non riformulare frasi\n4. Se un nome appare nella sezione firme, sostituiscilo anche l\xEC\n\nTESTO DA ANONIMIZZARE:\n"
